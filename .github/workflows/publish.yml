# Publish the release lines to their registries.
#
# Three independent release lines, each a bare tag (no v prefix):
#   - `<semver>`               → @igorjpimenta/winch             (core MCP server)
#   - `winch-openclaw-<semver>`→ @igorjpimenta/winch-openclaw    (OpenClaw plugin)
#   - `winch-opencode-<semver>`→ @igorjpimenta/winch-opencode    (OpenCode plugin)
# Each job validates that the tag matches the version in its own package.json
# and publishes stable to `latest`, prerelease to `beta`. Anything else fails.
#
# Core and openclaw go to GitHub Packages; GITHUB_TOKEN has packages:write via
# the `packages` permission below. Consumers need an .npmrc scope line:
#   @igorjpimenta:registry=https://npm.pkg.github.com
#
# The opencode line goes to npmjs through Trusted Publishing (OIDC): npm
# exchanges this run's id-token for a short-lived token scoped by the package's
# trusted-publisher entry (repo igorjpimenta/winch, file publish.yml, actions
# publish + dist-tag). NODE_AUTH_TOKEN is pinned empty on those steps — a
# non-empty token hides a failed exchange behind a PUT 404 — and publish runs
# --loglevel silly because npm logs OIDC failures at verbose only. A freshly
# created entry can take hours before the exchange accepts it; re-run the job.

name: publish

on:
  push:
    tags:
      - "[0-9]*"
      - "winch-openclaw-[0-9]*"
      - "winch-opencode-[0-9]*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  core:
    if: startsWith(github.ref_name, 'winch-openclaw-') == false && startsWith(github.ref_name, 'winch-opencode-') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@igorjpimenta"
      - run: npm ci
      - run: npm test
      - name: Resolve channel (stable vs beta)
        id: channel
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $GITHUB_REF_NAME is not release pattern <semver>[-prerelease]"
            exit 1
          fi
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $PKG — bump package.json first"
            exit 1
          fi
          # Versions carry the UTC date of the release; compare against the
          # tag's own date so a release cut after 00:00 UTC cannot ship
          # yesterday's date.
          # npm normalizes zero-padded version components (2026.11.03 ->
          # 2026.11.3), so compare semver-normalized integers on both sides.
          norm() { printf '%s' "$1" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}'; }
          # npm rewrites zero-padded components (2026.11.03 publishes as
          # 2026.11.3), so a padded package.json would ship a version its own
          # tag and consumers cannot address. Refuse the pad at the door.
          if [ "$(norm "${TAG%%-*}")" != "${TAG%%-*}" ]; then
            echo "::error::version ${TAG%%-*} has zero-padded components; npm normalizes them (use $(norm "${TAG%%-*}"))"
            exit 1
          fi
          TAG_DATE="$(norm "${TAG%%-*}" | tr . -)"
          UTC_DATE="$(norm "$(date -u +%Y.%m.%d)" | tr . -)"
          if [ "$TAG_DATE" != "$UTC_DATE" ]; then
            echo "::error::tag date $TAG_DATE != UTC date $UTC_DATE — rename the version"
            exit 1
          fi
          case "$TAG" in
            *-* ) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            * )   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm publish --tag ${{ steps.channel.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openclaw:
    if: startsWith(github.ref_name, 'winch-openclaw-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/openclaw/winch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@igorjpimenta"
      - name: Resolve channel (stable vs beta)
        id: channel
        run: |
          TAG="${GITHUB_REF_NAME#winch-openclaw-}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $GITHUB_REF_NAME is not release pattern winch-openclaw-<semver>[-prerelease]"
            exit 1
          fi
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME != plugin package.json $PKG — bump it first"
            exit 1
          fi
          # npm normalizes zero-padded version components (2026.11.03 ->
          # 2026.11.3), so compare semver-normalized integers on both sides.
          norm() { printf '%s' "$1" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}'; }
          # npm rewrites zero-padded components (2026.11.03 publishes as
          # 2026.11.3), so a padded package.json would ship a version its own
          # tag and consumers cannot address. Refuse the pad at the door.
          if [ "$(norm "${TAG%%-*}")" != "${TAG%%-*}" ]; then
            echo "::error::version ${TAG%%-*} has zero-padded components; npm normalizes them (use $(norm "${TAG%%-*}"))"
            exit 1
          fi
          TAG_DATE="$(norm "${TAG%%-*}" | tr . -)"
          UTC_DATE="$(norm "$(date -u +%Y.%m.%d)" | tr . -)"
          if [ "$TAG_DATE" != "$UTC_DATE" ]; then
            echo "::error::tag date $TAG_DATE != UTC date $UTC_DATE — rename the version"
            exit 1
          fi
          case "$TAG" in
            *-* ) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            * )   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm publish --tag ${{ steps.channel.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  opencode:
    if: startsWith(github.ref_name, 'winch-opencode-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/opencode/winch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10, which has no trusted publishing at all and
      # fails the exchange silently — npm >= 11.5.1 is the floor.
      - run: npm install -g npm@latest && npm --version
      - name: Resolve channel (stable vs beta)
        id: channel
        run: |
          TAG="${GITHUB_REF_NAME#winch-opencode-}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $GITHUB_REF_NAME is not winch-opencode-<semver>"
            exit 1
          fi
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME != opencode package.json $PKG"
            exit 1
          fi
          # npm normalizes zero-padded version components (2026.11.03 ->
          # 2026.11.3), so compare semver-normalized integers on both sides.
          norm() { printf '%s' "$1" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}'; }
          # npm rewrites zero-padded components (2026.11.03 publishes as
          # 2026.11.3), so a padded package.json would ship a version its own
          # tag and consumers cannot address. Refuse the pad at the door.
          if [ "$(norm "${TAG%%-*}")" != "${TAG%%-*}" ]; then
            echo "::error::version ${TAG%%-*} has zero-padded components; npm normalizes them (use $(norm "${TAG%%-*}"))"
            exit 1
          fi
          TAG_DATE="$(norm "${TAG%%-*}" | tr . -)"
          UTC_DATE="$(norm "$(date -u +%Y.%m.%d)" | tr . -)"
          if [ "$TAG_DATE" != "$UTC_DATE" ]; then
            echo "::error::tag date $TAG_DATE != UTC date $UTC_DATE — rename the version"
            exit 1
          fi
          case "$TAG" in
            *-* ) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            * )   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Publish unless this version already exists
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "@igorjpimenta/winch-opencode@$V" version >/dev/null 2>&1; then
            echo "::notice::$V is already published; skipping (tag kept for provenance)"
          else
            npm publish --tag ${{ steps.channel.outputs.tag }} --provenance --loglevel silly
          fi
        env:
          NODE_AUTH_TOKEN: ""
      - if: steps.channel.outputs.tag == 'beta'
        run: npm dist-tag add @igorjpimenta/winch-opencode@$(node -p "require('./package.json').version") latest
        env:
          NODE_AUTH_TOKEN: ""
