# Publish @igorjpimenta/winch to GitHub Packages on every GitHub Release.
# Flow: bump version in package.json → push → Releases → "Create a new
# release" with the tag matching package.json (e.g. v2026.10.22, or
# v2026.10.22-beta.0 for a beta) → publish. Tick "pre-release" on the
# release for a beta; leave it unticked for stable.
# Consumers install with an .npmrc pointing the scope at npm.pkg.github.com
# (see README "Install / run"): stable via `npm install -g
# @igorjpimenta/winch`, beta via `npm install -g @igorjpimenta/winch@beta`.
# GITHUB_TOKEN has packages:write via `packages` permission below — no
# personal token needed.
#
# How the script knows stable vs beta: it does not guess from the version
# string. It reads the release event — github.event.release.prerelease
# (the "Set as a pre-release" checkbox) — and publishes stable to the
# `latest` dist-tag, beta to the `beta` dist-tag. The tag-vs-package.json
# check below fails the run if they disagree, so a mistagged release can
# never ship the wrong version under either tag.

name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@igorjpimenta"
      - run: npm ci
      - run: npm test
      - name: Resolve channel (stable vs beta)
        id: channel
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag v$TAG != package.json $PKG — bump package.json first"
            exit 1
          fi
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --tag ${{ steps.channel.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
