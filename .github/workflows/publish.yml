# Publish the release lines to npmjs.
#
# Three independent release lines, each a bare tag (no v prefix):
#   - `<semver>`                → @igorjpimenta/winch             (core MCP server)
#   - `winch-openclaw-<semver>` → @igorjpimenta/winch-openclaw    (OpenClaw plugin)
#   - `winch-opencode-<semver>` → @igorjpimenta/winch-opencode    (OpenCode plugin)
#
# Auth is Trusted Publishing (OIDC) on every line: npm exchanges this run's
# id-token for a short-lived publish token scoped by the package's
# trusted-publisher entry (repo igorjpimenta/winch, file publish.yml, job
# core|openclaw|opencode). No stored token. The entry must exist on npmjs
# BEFORE the first publish of each package or the exchange fails with
# `package not found`; a freshly created entry can take hours before the
# exchange accepts it — re-run the job. NODE_AUTH_TOKEN is pinned empty on the
# publish steps: setup-node's registry-url leaves an XXXXX placeholder in the
# job env, and a non-empty token changes the failure from ENEEDAUTH into a PUT
# 404 that hides the exchange. Publish runs --loglevel silly because npm logs
# OIDC failures at verbose only (npm/cli #9923).
#
# Tombstone gate (all jobs): a version the registry has ever held is never
# reusable. `npm view <pkg> time` lists tombstones that `versions` omits; a
# live version is skipped so re-runs are green, an unpublished tombstone fails
# hard — npm's own rejection for those arrives only AFTER the upload.
#
# dist-tags: a prerelease publishes under beta and a stable under latest, on
# every line. Betas never move latest. The one exception is npm itself: the
# first-ever publish of a package gets latest regardless of --tag, because the
# registry has no other tag yet.
#
# Every tag gets an idempotent GitHub release with the npm link in its notes.

name: publish

on:
  push:
    tags:
      - "[0-9]*"
      - "winch-openclaw-[0-9]*"
      - "winch-opencode-[0-9]*"

permissions:
  contents: write
  id-token: write

jobs:
  core:
    if: startsWith(github.ref_name, 'winch-openclaw-') == false && startsWith(github.ref_name, 'winch-opencode-') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10, which has no trusted publishing at all and
      # fails the exchange silently — npm >= 11.5.1 is the floor.
      - run: npm install -g npm@latest && npm --version
      - name: Resolve channel (stable vs beta)
        id: channel
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $GITHUB_REF_NAME is not release pattern <semver>[-prerelease]"
            exit 1
          fi
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $PKG — bump package.json first"
            exit 1
          fi
          # npm normalizes zero-padded version components (2026.11.03 ->
          # 2026.11.3), so a padded package.json would ship a version its own
          # tag and consumers cannot address. Refuse the pad at the door.
          norm() { printf '%s' "$1" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}'; }
          if [ "$(norm "${TAG%%-*}")" != "${TAG%%-*}" ]; then
            echo "::error::version ${TAG%%-*} has zero-padded components; npm normalizes them (use $(norm "${TAG%%-*}"))"
            exit 1
          fi
          # Versions carry the UTC date of the release; compare against the
          # tag's own date so a release cut after 00:00 UTC cannot ship
          # yesterday's date.
          TAG_DATE="$(norm "${TAG%%-*}" | tr . -)"
          UTC_DATE="$(norm "$(date -u +%Y.%m.%d)" | tr . -)"
          if [ "$TAG_DATE" != "$UTC_DATE" ]; then
            echo "::error::tag date $TAG_DATE != UTC date $UTC_DATE — rename the version"
            exit 1
          fi
          case "$TAG" in
            *-* ) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            * )   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Refuse a version the registry has ever seen; skip a live one
        id: gate
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG" time --json | grep -q "\"$VERSION\""; then
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$PKG@$VERSION is already published; skipping (tag kept for provenance)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::$PKG@$VERSION was published before and unpublished — a seen version can never return; pick a new version"
              exit 1
            fi
          else
            echo "$PKG@$VERSION is unused on the registry"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm test
      - name: Publish (trusted publishing; silly so a failed exchange is visible)
        if: steps.gate.outputs.skip != 'true'
        run: npm publish --provenance --tag ${{ steps.channel.outputs.tag }} --loglevel silly
        env:
          NODE_AUTH_TOKEN: ""
      - name: Create GitHub release
        run: |
          TAG="$GITHUB_REF_NAME"
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PRERELEASE=""
          case "$TAG" in
            *-* ) PRERELEASE="--prerelease" ;;
          esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" $PRERELEASE \
              --notes "npm: https://www.npmjs.com/package/${PKG_NAME}/v/${PKG_VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openclaw:
    if: startsWith(github.ref_name, 'winch-openclaw-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/openclaw/winch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
