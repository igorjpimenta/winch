# Publish @igorjpimenta/winch to GitHub Packages on version tags.
# Flow: bump version in package.json → commit → `git tag <version>` (bare,
# matching repo habit, or v-prefixed) → push tag. The tag IS the release
# pattern: 2026.10.22 ships stable (`latest`), 2026.10.22-beta.0 ships
# beta. Anything else fails the run.
# Consumers: stable via `npm install -g @igorjpimenta/winch`, beta via
# `npm install -g @igorjpimenta/winch@beta` (.npmrc scope at
# npm.pkg.github.com, see README "Install / run").
# GITHUB_TOKEN has packages:write via `packages` permission below.

name: publish

on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@igorjpimenta"
      - run: npm ci
      - run: npm test
      - name: Resolve channel (stable vs beta)
        id: channel
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $GITHUB_REF_NAME is not release pattern <semver>[-prerelease]"
            exit 1
          fi
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $PKG — bump package.json first"
            exit 1
          fi
          case "$TAG" in
            *-* ) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            * )   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm publish --tag ${{ steps.channel.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
